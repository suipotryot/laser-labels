<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laser labels</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <header>
    <h1>Laser labels</h1>
    <p class="subtitle" data-i18n="ui.subtitle"></p>
    <label class="language">
      <span data-i18n="ui.language"></span>
      <select id="language"></select>
    </label>
  </header>
  <main>
    <form id="label-form" novalidate>
      <fieldset>
        <legend data-i18n="ui.label"></legend>
        <label><span data-i18n="ui.width"></span> <input id="width" inputmode="decimal" value="60" /></label>
        <label><span data-i18n="ui.height"></span> <input id="height" inputmode="decimal" value="20" /></label>
        <label><input id="has-frame" type="checkbox" /> <span data-i18n="ui.frame"></span></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="ui.part"></legend>
        <label><span data-i18n="ui.hardwareType"></span> <select id="hardware-type"></select></label>
        <label><span data-i18n="ui.dimensions"></span> <input id="dimensions" placeholder="3,5x50" /></label>
      </fieldset>
      <fieldset id="usage-fields">
        <legend data-i18n="ui.usage"></legend>
      </fieldset>
      <fieldset id="drive-fields">
        <legend data-i18n="ui.drive"></legend>
        <label><span data-i18n="ui.driveType"></span> <select id="drive-type"></select></label>
        <label><span data-i18n="ui.driveSize"></span> <select id="drive-size"></select></label>
      </fieldset>
    </form>
    <section class="result">
      <p id="error-message" role="alert"></p>
      <p id="preview-status" role="status"></p>
      <div id="preview"></div>
      <button id="download" type="button" disabled data-i18n="ui.download"></button>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
